<style>
:root{
  --navy:#13233f; --navy2:#1c3357; --ink:#0e1b30;
  --orange:#e6912a; --orange2:#f2a847; --red:#b23b42; --red2:#c84b52;
  --blue:#3f7fd6; --blue2:#5a96e6; --green:#2f8f6b; --gold:#c9a227;
  --text:#222b38; --muted:#94a0ad;
  --line:#e1e6ec; --graybox:#f1f4f8; --redbox:#fcf1f1; --redline:#e0a9ab; --bluebox:#eef4fb;
  --shadow:0 10px 30px rgba(19,35,63,.10);
  --shadow-sm:0 4px 14px rgba(19,35,63,.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#3f444b;font-family:"Yu Gothic","YuGothic","Noto Sans JP","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:30px;padding:48px 0;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;}
.slide{position:relative;width:1280px;height:720px;background:#fbfcfe;overflow:hidden;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.4);flex:0 0 auto;}
.slide::after{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--navy) 0%,var(--blue) 55%,var(--orange) 100%);z-index:3;}

/* header */
.hdr{position:absolute;top:5px;left:0;right:0;height:48px;background:linear-gradient(180deg,#16294a 0%,#11203a 100%);display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff;z-index:2;border-bottom:1px solid rgba(255,255,255,.06);}
.hdr .sec{font-size:15.5px;font-weight:700;letter-spacing:.04em;position:relative;padding-left:16px;}
.hdr .sec::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:18px;border-radius:3px;background:var(--orange);}
.hdr .brand{font-size:12.5px;color:#9fb0c6;letter-spacing:.42em;font-weight:600;}

/* badges & headings */
.badge{display:inline-block;background:linear-gradient(135deg,var(--red) 0%,var(--red2) 100%);color:#fff;font-size:19px;font-weight:800;letter-spacing:.22em;padding:11px 28px;border-radius:6px;box-shadow:0 6px 16px rgba(178,59,66,.28);text-transform:uppercase;}
.badge.navy{background:linear-gradient(135deg,#1b3157 0%,#2a4a7e 100%);box-shadow:0 6px 16px rgba(19,35,63,.28);}
.badge.orange{background:linear-gradient(135deg,var(--orange) 0%,var(--orange2) 100%);box-shadow:0 6px 16px rgba(230,145,42,.3);}
.badge.blue{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);box-shadow:0 6px 16px rgba(63,127,214,.28);}
.h-main{font-size:46px;font-weight:800;color:var(--navy);text-align:center;line-height:1.3;letter-spacing:.01em;}
.h-sub{font-size:24px;color:var(--muted);text-align:center;font-weight:600;}
.accent-red{color:var(--red);} .accent-orange{color:var(--orange);} .accent-navy{color:var(--navy);} .accent-blue{color:var(--blue);}

/* footer bars */
.foot-bar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1a2d4e 0%,#11203a 100%);color:#fff;text-align:center;padding:22px 24px;font-size:25px;font-weight:700;line-height:1.5;letter-spacing:.01em;}
.foot-bar .em{color:var(--orange2);}
.foot-note{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:23px;color:#aeb6c0;font-weight:600;}

/* ===== title / hook ===== */
.t-title{background:radial-gradient(130% 130% at 85% -10%,#2b5290 0%,transparent 55%),linear-gradient(155deg,#10203a 0%,#1c3357 60%,#21426f 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 90px;}
.t-title .kicker{font-size:24px;letter-spacing:.34em;color:#8fb4e6;font-weight:700;margin-bottom:30px;padding:9px 26px;border:1px solid rgba(143,180,230,.4);border-radius:30px;}
.t-title .big{font-size:74px;font-weight:800;line-height:1.26;letter-spacing:.01em;text-shadow:0 4px 24px rgba(0,0,0,.25);}
.t-title .big .em{color:var(--orange2);}
.t-title .lead{font-size:28px;color:#c6d2e2;margin-top:36px;font-weight:600;line-height:1.6;}
.t-title .brandtag{position:absolute;bottom:42px;font-size:15px;letter-spacing:.45em;color:#7e8aa0;}

/* ===== section divider ===== */
.t-section{background:linear-gradient(180deg,#fbfcfe 0%,#eef2f8 100%);}
.t-section .topic{position:absolute;top:100px;left:64px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);color:#fff;border-radius:10px;padding:16px 36px;font-size:27px;font-weight:800;display:flex;align-items:center;gap:22px;box-shadow:0 10px 24px rgba(63,127,214,.3);}
.t-section .topic .bar{width:42px;height:3px;background:rgba(255,255,255,.7);display:inline-block;border-radius:2px;}
.t-section .numbox{position:absolute;top:212px;left:96px;width:236px;height:226px;background:linear-gradient(150deg,#1b3157 0%,#11203a 100%);border-radius:22px;color:#fff;font-size:140px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(19,35,63,.32);}
.t-section .numbox::after{content:"";position:absolute;inset:0;border-radius:22px;border:1px solid rgba(255,255,255,.08);}
.t-section .stitle{position:absolute;left:376px;top:228px;right:64px;}
.t-section .stitle .label{font-size:22px;letter-spacing:.45em;color:#9aa4b2;font-weight:700;}
.t-section .stitle .ttl{font-size:60px;font-weight:800;color:var(--navy);margin-top:8px;line-height:1.18;letter-spacing:.01em;}
.t-section .stitle .rule{width:64px;height:5px;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:3px;margin:22px 0;}
.t-section .stitle .desc{font-size:24px;color:#9aa4b2;font-weight:600;}

/* ===== agenda / list ===== */
.t-agenda{padding:58px 76px 104px;display:flex;flex-direction:column;justify-content:center;}
.t-agenda.center{padding-top:58px;}
.t-agenda .h-main{margin:0 0 24px;}
.t-agenda .rows{display:flex;flex-direction:column;gap:13px;}
.t-agenda .row{display:flex;align-items:center;gap:24px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:13px;padding:17px 28px;box-shadow:var(--shadow-sm);}
.t-agenda .row .no{width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,#1b3157,#11203a);color:#fff;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 10px rgba(19,35,63,.25);}
.t-agenda .row .t{font-size:28px;font-weight:800;color:var(--navy);min-width:360px;}
.t-agenda .row .d{font-size:21px;color:var(--muted);font-weight:600;}
.t-agenda .row .d::before{content:"";display:inline-block;width:18px;height:2px;background:#cdd4dc;vertical-align:middle;margin-right:13px;}
.t-agenda .cta{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(135deg,var(--orange) 0%,var(--orange2) 100%);color:#fff;text-align:center;padding:20px;font-size:26px;font-weight:800;letter-spacing:.02em;}

/* ===== VS compare ===== */
.t-vs{padding:50px 66px 0;}
.t-vs .badge,.t-cards .badge,.t-stats .badge{display:inline-block;margin:0 0 16px;}
.t-vs .h-main{margin:0 0 32px;}
.t-vs .h-sub{margin:-22px 0 32px;}
.t-vs .cols{display:flex;align-items:stretch;justify-content:center;}
.t-vs .box{width:478px;background:#fff;border:1px solid var(--line);border-top:6px solid #9aa6b5;border-radius:14px;padding:42px 32px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;}
.t-vs .box.left{border-top-color:#8a97a8;}
.t-vs .box.right{background:linear-gradient(180deg,#fff,#fdf4f4);border-top-color:var(--red);}
.t-vs .box.bluebox{background:linear-gradient(180deg,#fff,#f3f8fe);border-top-color:var(--blue);}
.t-vs .box .name{font-size:32px;font-weight:800;color:#56616e;}
.t-vs .box.right .name{color:var(--red);} .t-vs .box.bluebox .name{color:var(--blue);}
.t-vs .box .cap{font-size:20px;color:#9aa3ad;margin-top:18px;}
.t-vs .box .big{font-size:46px;font-weight:800;color:var(--navy);margin-top:2px;}
.t-vs .box.right .big{color:var(--red);} .t-vs .box.bluebox .big{color:var(--blue);}
.t-vs .box .div{height:1px;background:#e4e8ee;margin:26px 0;}
.t-vs .box .small{font-size:19px;color:#9aa3ad;}
.t-vs .box .strong{font-size:28px;font-weight:800;color:#37404d;margin-top:4px;}
.t-vs .vsmark{display:flex;align-items:center;justify-content:center;align-self:center;font-size:26px;font-weight:800;color:var(--navy);margin:0 20px;flex:0 0 auto;width:66px;height:66px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);}

/* ===== 3 cards ===== */
.t-cards{padding:48px 54px 48px;display:flex;flex-direction:column;justify-content:center;}
.t-cards:has(.foot-bar){padding-bottom:104px;}
.t-cards .h-main{margin:0 0 8px;}
.t-cards .h-sub{margin-bottom:28px;}
.t-cards .grid{display:flex;gap:26px;justify-content:center;align-items:stretch;}
.t-cards .grid.g2{padding:0 70px;}
.t-cards .card{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:42px 26px 42px;text-align:center;position:relative;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
.t-cards .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;}
.t-cards .card.c1::before{background:linear-gradient(90deg,var(--red),var(--red2));}
.t-cards .card.c2::before{background:linear-gradient(90deg,var(--orange),var(--orange2));}
.t-cards .card.c3::before{background:linear-gradient(90deg,var(--blue),var(--blue2));}
.t-cards .card.c4::before{background:linear-gradient(90deg,var(--green),#3fae84);}
.t-cards .card .cno{width:62px;height:62px;border-radius:18px;color:#fff;font-size:25px;font-weight:800;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(19,35,63,.16);}
.t-cards .c1 .cno{background:linear-gradient(150deg,var(--red),var(--red2));} .t-cards .c2 .cno{background:linear-gradient(150deg,var(--orange),var(--orange2));} .t-cards .c3 .cno{background:linear-gradient(150deg,var(--blue),var(--blue2));} .t-cards .c4 .cno{background:linear-gradient(150deg,var(--green),#3fae84);}
.t-cards .card .ctitle{font-size:29px;font-weight:800;margin-bottom:16px;letter-spacing:.01em;}
.t-cards .c1 .ctitle{color:var(--red);} .t-cards .c2 .ctitle{color:#cf820f;} .t-cards .c3 .ctitle{color:var(--blue);} .t-cards .c4 .ctitle{color:var(--green);}
.t-cards .card .ctext{font-size:21px;color:#69727c;line-height:1.6;font-weight:600;}

/* ===== stats 3col ===== */
.t-stats{padding:58px 54px 0;}
.t-stats .h-main{margin-bottom:8px;}
.t-stats .h-sub{font-size:22px;margin-bottom:32px;}
.t-stats .cols{display:flex;gap:26px;justify-content:center;align-items:stretch;}
.t-stats .col{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.t-stats .col .top{background:linear-gradient(135deg,var(--orange) 0%,var(--orange2) 100%);color:#fff;text-align:center;padding:18px;}
.t-stats .col.cblue .top{background:linear-gradient(135deg,var(--blue),var(--blue2));} .t-stats .col.cnavy .top{background:linear-gradient(135deg,#1b3157,#2a4a7e);}
.t-stats .col .top .nm{font-size:27px;font-weight:800;} .t-stats .col .top .cd{font-size:18px;opacity:.9;}
.t-stats .col .body{padding:34px 16px 36px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;}
.t-stats .col .lbl{font-size:20px;color:#7a828c;font-weight:600;}
.t-stats .col .val{font-size:48px;font-weight:800;color:var(--navy);margin:4px 0 20px;}
.t-stats .col .val2{font-size:40px;font-weight:800;color:#cf820f;margin:4px 0 12px;}
.t-stats .col.cblue .val2{color:var(--blue);} .t-stats .col.cnavy .val2{color:var(--navy);}
.t-stats .col .tag{font-size:18px;color:#fff;font-weight:800;background:#cf820f;display:inline-block;padding:6px 20px;border-radius:20px;} .t-stats .col.cblue .tag{background:var(--blue);} .t-stats .col.cnavy .tag{background:var(--navy);}

/* ===== text-centric ===== */
.t-text{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:70px 100px 0;}
.t-text .lead{font-size:27px;color:#69727c;font-weight:600;margin-bottom:30px;line-height:1.6;position:relative;padding-top:26px;}
.t-text .lead::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:52px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--orange2));}
.t-text .stmt{font-size:54px;font-weight:800;color:var(--navy);line-height:1.4;letter-spacing:.01em;}
.t-text .stmt .em{color:#d6850f;} .t-text .stmt .emr{color:var(--red);}
.t-text .note{font-size:24px;color:#7a828c;font-weight:600;margin-top:36px;line-height:1.7;}

/* ===== flow / chain ===== */
.t-flow{padding:66px 56px 0;}
.t-flow .h-main{margin:28px 0 50px;}
.t-flow .chain{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:wrap;}
.t-flow .node{background:#fff;border:1px solid var(--line);border-bottom:5px solid #aeb8c4;border-radius:16px;padding:30px 28px;font-size:27px;font-weight:800;color:var(--navy);text-align:center;min-width:200px;line-height:1.4;box-shadow:var(--shadow-sm);}
.t-flow .node.danger{background:linear-gradient(180deg,#fff,#fdf3f3);border-bottom-color:var(--red);color:var(--red);}
.t-flow .arr{font-size:40px;color:#b6bec8;padding:0 18px;font-weight:800;}
.t-flow .release{margin-top:56px;text-align:center;font-size:30px;font-weight:800;color:var(--green);background:linear-gradient(180deg,#f0faf5,#e6f6ee);display:inline-block;padding:18px 40px;border-radius:40px;border:1px solid #bfe6d3;width:fit-content;margin-left:auto;margin-right:auto;}
.t-flow{display:flex;flex-direction:column;justify-content:center;}
.t-flow .release{align-self:center;}

/* ===== numeric ranking list ===== */
.t-rank{padding:56px 76px 0;display:flex;flex-direction:column;justify-content:center;}
.t-rank .badge,.t-rank .gtag{position:absolute;}
.t-rank .h-main{font-size:38px;margin:36px 0 14px;}
.t-rank .h-sub{margin-bottom:26px;font-size:21px;}
.t-rank .rows{display:flex;flex-direction:column;gap:13px;}
.t-rank .row{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:12px;padding:18px 28px;box-shadow:var(--shadow-sm);}
.t-rank .row .nm{font-size:26px;font-weight:800;color:var(--navy);flex:1;}
.t-rank .row .pct{font-size:33px;font-weight:800;color:#c0392b;min-width:160px;text-align:right;}
.t-rank .row .pct.up{color:#c0392b;}
.t-rank .gtag{display:inline-block;font-size:17px;font-weight:800;color:#fff;padding:8px 20px;border-radius:24px;box-shadow:var(--shadow-sm);}

/* ===== closing ===== */
.t-closing{background:radial-gradient(130% 130% at 85% -10%,#2b5290 0%,transparent 55%),linear-gradient(155deg,#10203a 0%,#1c3357 60%,#21426f 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.t-closing .big{font-size:56px;font-weight:800;line-height:1.38;text-shadow:0 4px 24px rgba(0,0,0,.25);}
.t-closing .big .em{color:var(--orange2);}
.t-closing .sub{font-size:27px;color:#c6d2e2;margin-top:32px;font-weight:600;}
.t-closing .tags{margin-top:46px;display:flex;gap:20px;}
.t-closing .tg{border:1.5px solid rgba(143,180,230,.6);background:rgba(143,180,230,.08);border-radius:40px;padding:15px 34px;font-size:25px;font-weight:800;color:#dbe7f5;}

/* ===== number visual (共通) ===== */
.numviz{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 80px 0;}
.numviz .lead{font-size:26px;color:#69727c;font-weight:600;margin-bottom:6px;position:relative;padding-top:26px;}
.numviz .lead::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:52px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--orange2));}
.numviz .h-main{margin:18px 0 44px;}
.numviz .note{font-size:24px;color:#7a828c;font-weight:600;margin-top:44px;line-height:1.7;}

/* big-number metrics */
.metrics{display:flex;gap:34px;justify-content:center;align-items:stretch;}
.metric{background:#fff;border:1px solid var(--line);border-top:6px solid var(--blue);border-radius:18px;box-shadow:var(--shadow);padding:40px 56px 42px;min-width:400px;}
.metric.blue{border-top-color:var(--blue);} .metric.navy{border-top-color:var(--navy);} .metric.up{border-top-color:#c0392b;}
.metric .mlbl{font-size:24px;color:#56616e;font-weight:800;}
.metric .mfig{font-size:104px;font-weight:800;line-height:1.04;margin:10px 0 8px;color:var(--blue);letter-spacing:.01em;}
.metric.navy .mfig{color:var(--navy);} .metric.up .mfig{color:#c0392b;}
.metric .mfig .u{font-size:52px;font-weight:800;}
.metric .msub{font-size:23px;color:#7a828c;font-weight:700;}
.metric.hero{padding:48px 80px 50px;}
.metric.hero .mfig{font-size:150px;}
.metric.hero .mfig .u{font-size:68px;}

/* proportion bar */
.t-prop .pbar{display:flex;width:1080px;height:150px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);}
.t-prop .seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
.t-prop .seg.main{background:linear-gradient(135deg,#1b3157,#2a4a7e);width:40%;}
.t-prop .seg.rest{background:#e6ebf1;color:#69727c;flex:1;}
.t-prop .seg .p{font-size:50px;font-weight:800;line-height:1;}
.t-prop .seg .l{font-size:21px;font-weight:700;margin-top:10px;opacity:.92;}

/* ===== steps (ascending progression) ===== */
.t-steps{display:flex;flex-direction:column;justify-content:center;padding:60px 70px 0;}
.t-steps .h-main{margin:0 0 56px;}
.t-steps .steps{display:flex;align-items:flex-end;justify-content:center;gap:26px;}
.t-steps .step{flex:0 0 auto;width:300px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--blue);border-radius:16px;box-shadow:var(--shadow);text-align:center;padding:24px 18px;display:flex;flex-direction:column;justify-content:flex-start;}
.t-steps .step.s1{height:190px;border-top-color:#9aa6b5;}
.t-steps .step.s2{height:250px;border-top-color:var(--blue);}
.t-steps .step.s3{height:320px;border-top-color:var(--orange);}
.t-steps .step .era{font-size:21px;color:#7a828c;font-weight:700;margin-bottom:12px;}
.t-steps .step .v{font-size:50px;font-weight:800;color:var(--navy);}
.t-steps .step.s3 .v{color:#d6850f;}
.t-steps .sarr{display:flex;align-items:flex-end;padding-bottom:60px;font-size:40px;color:#b6bec8;font-weight:800;}

/* ===== vertical bars compare ===== */
.t-vbars{display:flex;flex-direction:column;justify-content:center;padding:50px 80px 96px;}
.t-vbars .h-main{margin:0 0 12px;}
.t-vbars .h-sub{margin-bottom:30px;}
.t-vbars .vcols{display:flex;align-items:flex-end;justify-content:center;gap:90px;height:340px;}
.t-vbars .vb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.t-vbars .vb .bar{width:170px;border-radius:16px 16px 0 0;background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:0 10px 24px rgba(63,127,214,.25);display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:800;font-size:32px;padding-top:18px;}
.t-vbars .vb.orange .bar{background:linear-gradient(180deg,var(--orange2),var(--orange));box-shadow:0 10px 24px rgba(230,145,42,.25);}
.t-vbars .vb .cap{margin-top:18px;font-size:23px;font-weight:800;color:var(--navy);text-align:center;}
.t-vbars .vb .sub{font-size:19px;color:#7a828c;font-weight:600;margin-top:4px;}

/* compact variants for row-heavy slides */
.t-rank.compact{padding-top:44px;}
.t-rank.compact .h-main{margin:6px 0 10px;font-size:32px;}
.t-rank.compact .rows{gap:9px;}
.t-rank.compact .row{padding:12px 28px;}
.t-rank.compact .row .pct{font-size:29px;}
.t-agenda.compact{padding:52px 76px 44px;}
.t-agenda.compact .h-main{margin:0 0 16px;font-size:38px;}
.t-agenda.compact .rows{gap:10px;}
.t-agenda.compact .row{padding:13px 28px;}

/* before / after (fx) */
.t-fx{padding-left:40px;padding-right:40px;}
.t-fx .row{display:flex;align-items:center;justify-content:center;gap:18px;}
